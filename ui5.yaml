# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: cos.qmc.views.qmcviewdemo
type: application
framework:
  name: SAPUI5
  version: 1.143.2 # Use your actual version or "latest"
  libraries:
    - name: sap.m
    - name: sap.ui.core
    - name: sap.uxap  # This is the one you are missing!
server:
  customMiddleware:
    - name: fiori-tools-proxy
      afterMiddleware: compression
      configuration:
        ignoreCertErrors: true # Changed to true; helpful for dev environments
        ui5:
          path:
            - /resources
            - /test-resources
          url: https://ui5.sap.com
        backend:
          - path: /sap
            url: https://s4d.hostedsap.com
            destination: S4D
    - name: fiori-tools-appreload
      afterMiddleware: compression
      configuration:
        port: 35729
        path: webapp
        delay: 300
    - name: fiori-tools-preview
      afterMiddleware: fiori-tools-appreload
      configuration:
        flp:
          theme: sap_horizon
